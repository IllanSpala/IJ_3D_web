<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IJ 3D Manager — Versão Web. Gerencie seu acervo de impressão 3D diretamente no navegador, sem servidor.">
    <title>IJ 3D Manager — Web</title>
    <link rel="icon" href="assets/app_icon.png">
    <link rel="stylesheet" href="css/style.css">

    <!-- Libraries (local, no CDN dependency at runtime) -->
    <script src="lib/jszip.min.js"></script>
    <script src="lib/sql-wasm.js"></script>
</head>
<body>

    <!-- ═══════════════════════════════════════════════════════════
         BARRIER SCREEN (Upload Gate)
         Shown when IndexedDB has no cached data.
         ═══════════════════════════════════════════════════════════ -->
    <div id="barrier-screen" class="barrier-screen">
        <img src="assets/app_icon.png" alt="IJ 3D Manager" class="barrier-logo">
        <h1 class="barrier-title">IJ 3D Manager</h1>
        <p class="barrier-subtitle">Versão Web — Visualização Offline</p>

        <label class="upload-zone" id="upload-zone" for="upload-input">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:12px;opacity:0.8;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            <div class="upload-zone-text">
                Arraste seu arquivo de <strong>backup (.zip)</strong> aqui
                <br>— ou —
            </div>
            <span class="btn btn-primary upload-select-btn">Selecionar Arquivo</span>
            <input type="file" id="upload-input" accept=".zip" aria-label="Selecionar arquivo de backup ZIP">
            <div class="upload-zone-hint">Exportado no app desktop Windows</div>
        </label>

        <div class="barrier-info">
            <div class="barrier-info-row">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                <span>O backup é gerado pelo aplicativo desktop.</span>
            </div>
            <div class="barrier-info-row">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <span>Seus dados não saem do navegador. Tudo é processado localmente.</span>
            </div>
            <div class="barrier-info-row">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
                <span>Funciona em qualquer dispositivo com navegador moderno.</span>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <div class="progress-label" id="progress-label">Aguardando upload…</div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════
         APP SHELL (Sidebar + Main Content)
         Shown after backup is loaded.
         ═══════════════════════════════════════════════════════════ -->
    <div id="app-shell" style="display:none; width:100%; height:100vh;">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-nav" id="sidebar-nav"></div>
            <div class="sidebar-bottom" id="sidebar-bottom"></div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content" id="main-content"></main>
    </div>

    <!-- App entry point -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
